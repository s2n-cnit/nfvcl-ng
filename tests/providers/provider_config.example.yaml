---
vims:
  - area: 1
    resource_group: provider_test
    existing_networks:
      - mgmt-net
    missing_networks:
      - nfvcl-provider-test-missing-network
    vim:
      name: openstack_lab
      vim_type: openstack
      vim_url: http://openstack.example:5000/v3
      vim_user: demo
      vim_password: change-me
      vim_timeout: 15
      vim_openstack_parameters:
        project_name: demo
        user_domain_name: Default
        project_domain_name: Default
        region_name: RegionOne
      config:
        insecure: true
        APIversion: v3.3
        use_floating_ip: false
      networks:
        - mgmt-net
      routers: []
      areas:
        - 1
    create_network:
      name: nfvcl-provider-test-net
      cidr: 10.250.0.0/24
